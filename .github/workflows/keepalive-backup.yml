name: Keep alive & back up votes

# Every 5 minutes: wake the Render free instance (it sleeps after 15 idle minutes and
# its disk is wiped), then save the current restaurants + vote counts to the `data`
# branch. The server restores from that backup automatically after any restart.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keepalive-backup
  cancel-in-progress: false

env:
  SITE: https://restaurant-vote-server.onrender.com

jobs:
  keepalive-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wake the site and fetch a backup
        id: fetch
        run: |
          code=$(curl -sS -o backup.json -w '%{http_code}' --retry 4 --retry-delay 15 --retry-all-errors --max-time 120 "$SITE/api/backup" || echo 000)
          echo "HTTP $code"
          if [ "$code" = "200" ] && python3 -c "import json,sys; d=json.load(open('backup.json')); sys.exit(0 if d.get('trusted') is True and isinstance(d.get('data',{}).get('restaurants'), list) else 1)"; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "No trustworthy backup this round (site waking up, restoring, or an older version). Ping only."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the data branch
        if: steps.fetch.outputs.ok == 'true'
        run: |
          git init -q store && cd store
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin data; then git checkout -q -B data FETCH_HEAD; else git checkout -q --orphan data; fi

      - name: Commit if anything changed
        if: steps.fetch.outputs.ok == 'true'
        run: |
          python3 - <<'PY'
          import json, os
          new = json.load(open('backup.json'))['data']
          path = 'store/state.json'
          old = None
          if os.path.exists(path):
              try: old = json.load(open(path)).get('data')
              except Exception: old = None
          if old == new:
              print('No change'); open('nochange', 'w').close()
          else:
              json.dump({'data': new}, open(path, 'w'), ensure_ascii=False, indent=1)
              lines = ['| 餐廳 | 票數 | 連結 |', '| --- | --- | --- |']
              for r in sorted(new['restaurants'], key=lambda r: -len(r.get('ballots', []))):
                  name = r['name'].replace('|', '/')
                  lines.append(f"| {name} | {len(r.get('ballots', []))} | {r['url']} |")
              open('store/README.md', 'w').write('# ' + new.get('title', '') + '\n\n自動備份（每 5 分鐘）。\n\n' + '\n'.join(lines) + '\n')
          PY
          if [ -f nochange ]; then exit 0; fi
          cd store
          git add state.json README.md
          git -c user.name="vote-backup-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Backup $(date -u +%FT%TZ)"
          git push -q origin data
